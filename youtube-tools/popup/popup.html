<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  /* Tông trắng đen, chỉ một màu nhấn (đỏ YouTube) cho trạng thái "đang bật". */
  :root {
    --bg: #ffffff;
    --surface: #f6f6f6;
    --surface-hover: #efefef;
    --text: #0f0f0f;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --track: #d4d4d4;
    --knob: #ffffff;
    --accent: #e62117;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --surface: #1d1d1d;
      --surface-hover: #242424;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --track: #3a3a3a;
      --knob: #f1f1f1;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; width: 300px; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header { padding: 16px 16px 14px; display: flex; align-items: center; gap: 12px; }
  .logo {
    position: relative; width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border-radius: 10px; background: var(--text);
  }
  .logo::after { /* tam giác play */
    content: ""; margin-left: 3px;
    border-left: 11px solid var(--bg);
    border-top: 7px solid transparent; border-bottom: 7px solid transparent;
  }
  .logo::before { /* vòng sáng lan nhẹ khi có tính năng đang bật */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 1.5px solid var(--accent); opacity: 0;
  }
  body.active .logo::before { animation: ring 3.2s var(--ease) infinite; }
  @keyframes ring {
    0%   { transform: scale(1);   opacity: .55; }
    70%  { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  .title { flex: 1; min-width: 0; }
  h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .status { margin: 1px 0 0; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--track);
    transition: background .4s var(--ease);
  }
  body.active .dot { background: var(--accent); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  .version {
    font: 500 11px ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--muted); padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px;
  }

  /* ---------- Danh sách tính năng ---------- */
  #list { padding: 0 10px; display: grid; gap: 6px; }
  .feature {
    position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px;
    align-items: start; padding: 12px 12px 12px 10px; border-radius: 12px;
    background: var(--surface); cursor: pointer; overflow: hidden;
    transition: background .2s var(--ease), transform .2s var(--ease);
    opacity: 0; transform: translateY(6px);
    animation: enter .45s var(--ease) forwards;
    animation-delay: calc(var(--i) * 70ms + 60ms);
  }
  .feature:hover { background: var(--surface-hover); }
  .feature:active { transform: scale(.985); }
  @keyframes enter { to { opacity: 1; transform: none; } }

  /* Vạch nhấn bên trái, mọc ra khi bật */
  .feature::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--accent);
    transform: scaleY(0); transition: transform .35s var(--spring);
  }
  .feature.on::before { transform: scaleY(1); }

  .num {
    font: 500 11px/20px ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--muted); transition: color .3s var(--ease);
  }
  .feature.on .num { color: var(--text); }
  .name { font-weight: 600; font-size: 13.5px; line-height: 20px; }
  .desc { grid-column: 2 / -1; color: var(--muted); font-size: 12px; margin: 0; }

  /* Công tắc */
  .switch {
    appearance: none; margin: 0; flex: none; cursor: pointer;
    position: relative; width: 34px; height: 20px; border-radius: 999px;
    background: var(--track); transition: background .3s var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--knob);
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .35s var(--spring), width .2s var(--ease);
  }
  .switch:active::after { width: 20px; }
  .switch:checked { background: var(--text); }
  .switch:checked::after { transform: translateX(14px); background: var(--bg); }
  .switch:checked:active::after { transform: translateX(10px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 12px; padding: 10px 16px 12px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11.5px; height: 38px; position: relative; overflow: hidden;
  }
  footer span { position: absolute; left: 16px; transition: opacity .25s var(--ease), transform .25s var(--ease); }
  .saved { opacity: 0; transform: translateY(8px); color: var(--text); }
  footer.flash .hint { opacity: 0; transform: translateY(-8px); }
  footer.flash .saved { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .feature { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div class="title">
      <h1>YouTube Tools</h1>
      <p class="status"><span class="dot"></span><span id="count"></span></p>
    </div>
    <span class="version" id="version"></span>
  </header>
  <div id="list"></div>
  <footer id="footer">
    <span class="hint">Thay đổi áp dụng ngay, không cần tải lại trang.</span>
    <span class="saved">✓ Đã lưu</span>
  </footer>
  <script src="../src/features.js"></script>
  <script src="popup.js"></script>
</body>
</html>
