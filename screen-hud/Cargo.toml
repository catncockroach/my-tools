[package]
name = "screen-hud"
version = "0.3.0"
edition = "2021"
description = "Overlay nhỏ, mờ ở góc màn hình Windows: % pin thiết bị Bluetooth đang kết nối"
publish = false

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceQuery",
  "Win32_Devices_Properties",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# Process nền chạy cả ngày: ưu tiên nhỏ gọn.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
